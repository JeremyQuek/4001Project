[project]
name = "sc4001-relation-lie-detector"
version = "0.1.0"
description = "SC4001 Project E: detecting wrong spatial-relation answers in a VLM from hidden states"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "numpy",
    "scikit-learn",
    "joblib",
    "torch",
    "torchvision",
    "transformers>=5",
    "accelerate",
    "huggingface_hub",
    "pillow",
    "matplotlib",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# scripts are run directly from src/; nothing is installed as a package
[tool.setuptools]
py-modules = []
