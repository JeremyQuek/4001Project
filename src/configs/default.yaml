# All paths are relative to the working directory unless absolute.
# On Colab, override paths.* to point at Google Drive (see notebooks/colab_runner.ipynb).
run_name: default
seed: 0

paths:
  data_root: data          # COCO annotations, images, CHAIR synonyms, POPE files
  out_root: runs           # every stage writes under <out_root>/<run_name>/

data:
  n_images: 4000
  split: [0.7, 0.15, 0.15] # train / val / test, split by image
  exclude_pope: true       # POPE is built on COCO val2014; keep its images out of our splits
  annotations_url: http://images.cocodataset.org/annotations/annotations_trainval2014.zip
  synonyms_url: https://raw.githubusercontent.com/LisaAnne/Hallucination/master/data/synonyms.txt
  pope_urls:
    - https://raw.githubusercontent.com/AoiDragon/POPE/main/output/coco/coco_pope_random.json
    - https://raw.githubusercontent.com/AoiDragon/POPE/main/output/coco/coco_pope_popular.json
    - https://raw.githubusercontent.com/AoiDragon/POPE/main/output/coco/coco_pope_adversarial.json
  download_workers: 16

model:
  name: Qwen/Qwen2-VL-2B-Instruct
  dtype: float16           # T4 has no bf16; switch to float32 if the pilot shows NaN / garbage captions
  attn_implementation: sdpa
  min_pixels: null
  max_pixels: null         # e.g. 200704 (256*28*28) to lower image resolution and raise hallucination rate

generation:
  prompt: Describe this image in detail.
  max_new_tokens: 256
  batch_size: 8
  pilot_n: 100

activations:
  layer_stride: 4          # save every 4th layer, plus the last layer
  layers: null             # or an explicit list, e.g. [8, 16, 24, 28]
  positions: [post, pre1, pre2, pre3]
  shard_size: 100          # images per shard (resume granularity)
  attention: false         # also record attention-to-image (forces eager attention; slower, more memory)

probe:
  models: [logreg, mlp]
  logreg_C: [0.001, 0.01, 0.1, 1.0]
  mlp:
    hidden: 256
    dropout: 0.1
    lr: 0.001
    weight_decay: 0.0001
    batch_size: 256
    max_epochs: 40
    patience: 5
  seeds: [0, 1, 2]
  train_fractions: [0.25, 0.5, 1.0]
  exclude_overlap: false   # drop pre-k samples whose position is another object's token

part3:
  n_images: 250            # test images used for correction experiments
  max_new_tokens: 128
  feedback_rounds: 2
  feedback_sources: [probe, random, perfect, baseline]
  baseline_score: token_prob   # which baseline's flags to use as the "best baseline" source
  guided_policies: [candidate, skip]
  guided_sources: [probe, random, perfect]
  max_repicks_per_slot: 3
  max_repicks_per_caption: 10

eval:
  n_bootstrap: 1000
